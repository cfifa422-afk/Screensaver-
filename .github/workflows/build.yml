name: Build ScreenSense APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if [ -f "ScreenSense-Android-Project (1).zip" ]; then
            unzip -q "ScreenSense-Android-Project (1).zip"
            echo "Extracted Android project"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Project Root & Build APK
        run: |
          echo "Listing repository files:"
          ls -la

          # Find the directory containing settings.gradle or settings.gradle.kts and an app folder
          PROJECT_DIR="."
          if [ -d "android/app" ]; then
            PROJECT_DIR="android"
          elif [ -d "ScreenSense-Android-Project/app" ]; then
            PROJECT_DIR="ScreenSense-Android-Project"
          elif [ -d "ScreenSense-Android-Project/android/app" ]; then
            PROJECT_DIR="ScreenSense-Android-Project/android"
          fi

          echo "Using project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSense-APK
          path: '**/build/outputs/apk/debug/*.apk' 
